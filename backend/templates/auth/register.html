{% extends 'base.html' %}

{% block title %}Ro'yxatdan o'tish — ElectroShop{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-14">
    <div class="bg-white rounded-3xl border border-slate-200 p-8 sm:p-10 shadow-xl">
        
        <div class="text-center mb-8">
            <span class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fa-solid fa-user-plus"></i>
            </span>
            <h1 class="text-2xl font-black text-slate-900">Yangi hisob yaratish</h1>
            <p class="text-xs text-slate-500 mt-1">1 daqiqada ro'yxatdan o'ting va xaridlarni oson bajaring</p>
        </div>

        <form method="POST" action="{% url 'store:register' %}" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Ismingiz</label>
                    <input type="text" name="first_name" value="{{ first_name|default:'' }}" placeholder="Masalan: Aziz" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Familiyangiz</label>
                    <input type="text" name="last_name" value="{{ last_name|default:'' }}" placeholder="Masalan: Saidov" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Login (Foydalanuvchi nomi) <span class="text-rose-500">*</span></label>
                <div class="relative">
                    <input type="text" name="username" required value="{{ username|default:'' }}" placeholder="aziz_99" 
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                    <i class="fa-solid fa-at absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Telefon raqam</label>
                    <input type="tel" name="phone" value="{{ phone|default:'' }}" placeholder="+998 90 123 45 67" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email (ixtiyoriy)</label>
                    <input type="email" name="email" value="{{ email|default:'' }}" placeholder="user@gmail.com" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Parol <span class="text-rose-500">*</span></label>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Parolni tasdiqlang <span class="text-rose-500">*</span></label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm flex items-center justify-center gap-2 mt-4 glow-hover active:scale-[0.99]">
                <i class="fa-solid fa-user-check"></i> Ro'yxatdan o'tish
            </button>
        </form>

        <div class="text-center pt-6 mt-6 border-t border-slate-100 text-xs text-slate-600">
            Hisobingiz bormi? 
            <a href="{% url 'store:login' %}" class="font-bold text-indigo-600 hover:text-indigo-800 ml-1">
                Kirish
            </a>
        </div>

    </div>
</div>
{% endblock %}
